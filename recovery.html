<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinguaFlash Recovery</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#0f172a;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}.box{max-width:540px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(15,23,42,.08)}h1{font-size:22px;margin:0 0 10px}p{line-height:1.5;color:#475569}.ok{color:#047857;font-weight:700}</style>
</head>
<body><div class="box"><h1>Đang cập nhật LinguaFlash…</h1><p id="status">Đang cài bản v37: khi đáp án có hai cách viết ngăn bởi dấu / hoặc ／, người học chỉ cần nhập một trong hai cách đúng. Ví dụ câu có 好/好多了 sẽ chấp nhận cả câu dùng 好 hoặc câu dùng 好多了. FSRS-6, tiến độ và dữ liệu học được giữ nguyên.</p></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    ['linguaflash_study_active_recall_v1','linguaflash_study_preferences_v1'].forEach(k=>localStorage.removeItem(k));
    if(!('serviceWorker' in navigator)) throw new Error('Trình duyệt không hỗ trợ Service Worker');
    status.textContent='Đang cài bản v37…';
    const reg=await navigator.serviceWorker.register('./service-worker.js?recovery=37',{scope:'./',updateViaCache:'none'});
    await reg.update().catch(()=>{});
    let worker=reg.installing||reg.waiting||reg.active;
    if(worker && worker.state!=='activated'){
      await new Promise(resolve=>{
        const done=()=>{if(worker.state==='activated'||worker.state==='redundant')resolve()};
        worker.addEventListener('statechange',done); done(); setTimeout(resolve,15000);
      });
    }
    if(!navigator.serviceWorker.controller){
      await Promise.race([new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true})),sleep(2500)]);
    }
    status.className='ok';
    status.textContent='Đã cài v37. Đáp án có dấu / giờ chấp nhận một trong hai cách đúng. Đang mở LinguaFlash…';
    await sleep(500);
    location.replace('./?recovery=37&t='+Date.now());
  }catch(e){
    console.error(e);
    status.textContent='Recovery gặp lỗi: '+(e&&e.message?e.message:e)+'. Hãy tải lại trang recovery một lần.';
  }
})();
</script></body></html>
